<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción por ruta: los pone el router (src/content/copy.ts → SEO).
         Estos son los valores de la carga inicial (lo que leen los bots sin JS). -->
    <title>DECO by DC | Diseño de interiores y fábrica propia en Samborondón</title>
    <meta name="description" content="Diseñamos y fabricamos tu sala, cocina, dormitorio o casa completa en Samborondón. Fábrica propia: lo que ves en el diseño es lo que llega a tu casa." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#2d1411" />

    <!-- Meta Pixel: lo inyecta vite.config.ts (plugin metaPixel) con META_PIXEL_ID de
         src/config/funnel.ts. Vacío = sin pixel. No carga en localhost. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,50;1,9..144,300..500,50&family=Outfit:wght@300;400;500;600&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Open Graph. og:image debe ser una URL ABSOLUTA del dominio final (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="DECO by DC" />
    <meta property="og:title" content="DECO by DC | Diseño de interiores y fábrica propia en Samborondón" />
    <meta property="og:description" content="Diseñamos y fabricamos tu sala, cocina, dormitorio o casa completa en Samborondón. Fábrica propia: lo que ves en el diseño es lo que llega a tu casa." />
    <meta property="og:image" content="https://deco-by-dc-lng.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
